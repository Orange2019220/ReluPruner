[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "relupruner"
version = "1.0.0"
description = "Taylor-based ReLU pruning for efficient private inference"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [{name = "Zhenpeng Li"}]
dependencies = [
  "numpy>=1.23",
  "torch>=1.12",
  "torchvision>=0.13",
]

[project.optional-dependencies]
dev = ["pytest>=7", "ruff>=0.5"]

[project.scripts]
relupruner-train-teacher = "scripts.train_teacher:main"
relupruner-prune = "scripts.train_pruner:main"
relupruner-finetune = "scripts.finetune:main"
relupruner-evaluate = "scripts.evaluate:main"

[tool.setuptools.packages.find]
include = ["relupruner*", "scripts*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
